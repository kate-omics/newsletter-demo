<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vitamin D Newsletter | PhoenixAI Health Newsletter</title>

    <meta
        name="description"
        content="An educational newsletter about vitamin D, its functions, sources, recommended intake, and risk factors."
    >

    <!-- LinkedIn and social-media preview information -->
    <meta property="og:title" content="Vitamin D: The Sunshine Vitamin">

    <meta
        property="og:description"
        content="Learn about vitamin D, recommended intake, food sources, risk factors, and laboratory results."
    >

    <meta
        property="og:image"
        content="images/vitamin-d-newsletter.png"
    >

    <meta property="og:type" content="article">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #eef3f4;
            color: #17384a;
        }

        .topbar {
            background: white;
            padding: 18px 24px;
            border-bottom: 1px solid #d8e1e4;
        }

        .topbar-content {
            width: 94%;
            max-width: 1100px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .site-name {
            margin: 0;
            font-size: 1.25rem;
            color: #087f8c;
        }

        .home-link {
            color: #087f8c;
            font-weight: bold;
            text-decoration: none;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        main {
            width: 94%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .newsletter-wrapper {
            background: white;
            padding: 14px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(16, 53, 67, 0.12);
        }

        .newsletter-image {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 10px;
        }

        .actions {
            margin-top: 22px;
            text-align: center;
        }

        .button {
            display: inline-block;
            background: #087f8c;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .button:hover {
            background: #056873;
        }

        footer {
            width: 94%;
            max-width: 900px;
            margin: 25px auto 40px;
            text-align: center;
            color: #61747c;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .topbar-content {
                align-items: flex-start;
                flex-direction: column;
            }

            main {
                margin-top: 20px;
            }

            .newsletter-wrapper {
                padding: 6px;
                border-radius: 8px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-content">

            <p class="site-name">
                PhoenixAI Health Newsletter
            </p>

            <a class="home-link" href="index.html">
                ← View all newsletters
            </a>

        </div>
    </header>

    <main>

        <div class="newsletter-wrapper">

            <img
                class="newsletter-image"
                src="images/vitamin-d-newsletter.png"
                alt="Vitamin D educational health newsletter"
            >

        </div>

        <div class="actions">

            <a
                class="button"
                href="images/vitamin-d-newsletter.png"
                target="_blank"
                rel="noopener noreferrer"
            >
                Open full-size newsletter
            </a>

        </div>

    </main>

    <footer>
        This newsletter is provided for educational purposes only and
        is not a substitute for professional medical advice, diagnosis,
        or treatment.
    </footer>

</body>

</html>
